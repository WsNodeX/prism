[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-llm"
version = "1.0.0"
description = "A zero-dependency toolkit for building resilient LLM applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "ai", "agent", "resilience", "circuit-breaker", "retry", "caching", "routing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools]
packages = ["prism", "prism.core"]
